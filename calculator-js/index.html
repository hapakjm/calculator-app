<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <header>
      <h1>Calculator App</h1>
    </header>

    <main>
      <div id="app">
        <div class="display">
          <div class="display-header">
            <div class="menu-container">
              <img
                src="./src/assets/bars-solid-full.svg"
                alt="menu"
                width="25"
                height="25"
                class="button-icon"
              />
              <span class="calculator-title">Calculator</span>
            </div>
            <img
              src="./src/assets/palette-solid-full.svg"
              alt="menu"
              width="25"
              height="25"
              class="button-icon"
            />
            <img
              src="./src/assets/clock-rotate-left-solid-full.svg"
              alt="menu"
              width="25"
              height="25"
              class="button-icon"
            />
          </div>

          <div class="display-total">0</div>

          <div class="display-input">0</div>
        </div>

        <div class="buttons-container">
          <button class="clear-button">C</button>
          <button class="delete-button">⌫</button>
          <button class="percentage-button">%</button>
          <button class="operator-button">÷</button>

          <button class="number-button">7</button>
          <button class="number-button">8</button>
          <button class="number-button">9</button>
          <button class="operator-button">×</button>

          <button class="number-button">4</button>
          <button class="number-button">5</button>
          <button class="number-button">6</button>
          <button class="operator-button">−</button>

          <button class="number-button">1</button>
          <button class="number-button">2</button>
          <button class="number-button">3</button>
          <button class="operator-button">+</button>

          <button class="decimal-button">.</button>
          <button class="number-button zero-button">0</button>
          <button class="equals-button">=</button>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
